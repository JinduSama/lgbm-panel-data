[project]
name = "lgbm-panel-data"
version = "0.1.0"
description = "LightGBM guide and utilities for panel / time-series forecasting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jfrie" }]
keywords = ["lightgbm", "forecasting", "timeseries", "panel", "ml"]
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgbm_panel"]

[tool.uv]
# Python environments in this project are managed exclusively with `uv`.
# See the "uv-only" skill for the full workflow.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
